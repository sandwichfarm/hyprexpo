name: Cancel closed pull-request workflows

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    name: Cancel queued and running PR workflows
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Cancel active runs for this pull request
        shell: bash
        run: |
          set -euo pipefail
          for status in queued in_progress; do
            runs=$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&status=${status}&per_page=100" \
              --jq '
                .workflow_runs[]
                | select(.id != (env.GITHUB_RUN_ID | tonumber))
                | select(any(.pull_requests[]?; .number == (env.PR_NUMBER | tonumber)))
                | .id
              ')
            while IFS= read -r run_id; do
              [[ -n $run_id ]] || continue
              echo "Canceling ${status} workflow run ${run_id} for PR #${PR_NUMBER}."
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null
            done <<< "$runs"
          done
