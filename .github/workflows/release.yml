name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    container:
      image: archlinux:latest

    steps:
      - name: Initialize pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            hyprland \
            pango \
            cairo \
            libdrm \
            libinput \
            pixman \
            wayland \
            libxkbcommon \
            lua \
            pkgconf

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          # Need the full history + tags so the build bakes the exact tag
          # version (scripts/version.sh uses `git describe`).
          fetch-depth: 0

      - name: Trust checkout inside build container
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Verify version matches tag
        run: make check-version TAG="${RELEASE_TAG}"

      - name: Verify hyprpm commit pins
        run: make check-pins REF="${RELEASE_TAG}"

      - name: Verify parser tests
        run: make test

      - name: Build plugin
        run: |
          lua_pkg_config=
          for module in lua lua5.5 lua55 lua-5.5 lua-55; do
            if pkg-config --exists "$module >= 5.5" "$module < 5.6"; then
              lua_pkg_config=$module
              break
            fi
          done
          test -n "$lua_pkg_config" || { echo 'Lua 5.5 development files are required' >&2; exit 1; }
          make all LUA_PKG_CONFIG="$lua_pkg_config"
          printf 'RELEASE_LUA_PKG_CONFIG=%s\n' "$lua_pkg_config" >> "$GITHUB_ENV"

      - name: Record build provenance
        run: |
          set -eu
          plugin_commit=$(git rev-parse HEAD)
          plugin_version=$(cat VERSION)
          {
            printf 'release tag: %s\n' "$RELEASE_TAG"
            printf 'plugin commit: %s\n' "$plugin_commit"
            printf 'plugin VERSION: %s\n' "$plugin_version"
            echo
            echo "Hyprland binary version:"
            Hyprland --version
            echo
            echo "Arch package versions:"
            pacman -Q hyprland lua
            echo
            echo "pkg-config hyprland:"
            pkg-config --modversion hyprland
            echo
            printf 'pkg-config Lua module: %s\n' "$RELEASE_LUA_PKG_CONFIG"
            pkg-config --modversion "$RELEASE_LUA_PKG_CONFIG"
            echo
            echo "compiler:"
            c++ --version | head -n 1
            echo
            echo "ELF dynamic dependencies:"
            readelf -d hyprexpo.so
            echo
            echo "ldd -r hyprexpo.so:"
            ldd -r hyprexpo.so || true
            echo
            echo "artifact SHA256:"
            sha256sum hyprexpo.so
          } > release-provenance.txt
          cat release-provenance.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            hyprexpo.so
            release-provenance.txt
          generate_release_notes: true
